# Redis ACL rules of ReconOS, without passwords. render-acl.sh adds each
# password hash and writes the aclfile Redis loads: docs/ops/deployment.md
#
# default: the core, that is Backend API, dispatcher, background process and
# Celery Beat. Every key. Named `default` so the core authenticates with a
# password only, as RECONOS_REDIS_URL carries no account name.
# worker: only the job queues and the kombu keys of those queues. Writing to
# `parse`, `schedule` or their bindings is denied, so a compromised worker
# cannot queue a parse or schedule task (tech debt 15, G5).
#
# Worker keys with kombu 5.7 and the transport options of
# workers/worker/celery_app.py:
#   job.<tool module>                      queue list
#   job.<tool module>\x06\x16<priority>    priority sub-lists, same prefix
#   _kombu.binding.job.<tool module>       binding set of the queue exchange
#   _kombu.binding_permanent.job.<tool module>  marks the binding as not expiring
#   job.unacked, job.unacked_index         unacked messages of workers only
#   job.unacked_mutex                      lock while restoring them
# Commands: queue reads and writes, the binding set, the unacked hash and
# sorted set, the redis-py lock (SET NX, Lua release), MULTI/EXEC.
default ~* &* +@all
worker resetkeys resetchannels -@all +hello +auth +ping +select +client|setname +client|setinfo +brpop +rpop +lpush +rpush +llen +sadd +smembers +hset +hget +hdel +zadd +zrem +zrange +zrevrangebyscore +set +get +del +evalsha +eval +script|load +multi +exec +watch +unwatch +discard ~job.* ~_kombu.binding.job.* ~_kombu.binding_permanent.job.*
