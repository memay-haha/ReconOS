<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luồng hệ thống TÊN_DỰ_ÁN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tabs on top; each tab is a diagram card plus a side panel, stacked on narrow screens. */
:root {
  --bg: #f3f5f8;
  --card: #ffffff;
  --ink: #142033;
  --muted: #64718a;
  --border: #dfe4ec;
  --soft: #eef1f6;
  --async: #7a4fd6;
  --c-http: #2563eb;
  --c-sql: #0e8a5f;
  --c-s3: #c06a00;
  --c-queue: #7a4fd6;
  --c-run: #c62f3b;
  --c-inproc: #142033;
  --fail: #c62f3b;
  --fail-bg: #fdecee;
  --zone-core: #eaf0f8;
  --zone-partial: #fbf1e4;
  --zone-out: #f6f7f9;
  --tx: #e3ecfb;
  --loop: #eef6ea;
  --select: #2457d6;
  --shadow: 0 1px 2px rgba(20, 32, 51, .06), 0 4px 14px rgba(20, 32, 51, .06);
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #8e9ab0; --border: #283242; --soft: #1d2531;
    --c-http: #7aa7ff; --c-sql: #4cc893; --c-s3: #f2a84e; --c-queue: #b49bff; --c-run: #ff7b86; --c-inproc: #e6ebf2; --async: #b49bff; --fail: #ff7b86; --fail-bg: #3a1c21; --zone-core: #182334; --zone-partial: #2c2318; --zone-out: #151b23;
    --tx: #1c2a44; --loop: #1b2b1e; --select: #7ea2ff; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #8e9ab0; --border: #283242; --soft: #1d2531;
  --c-http: #7aa7ff; --c-sql: #4cc893; --c-s3: #f2a84e; --c-queue: #b49bff; --c-run: #ff7b86; --c-inproc: #e6ebf2; --async: #b49bff; --fail: #ff7b86; --fail-bg: #3a1c21; --zone-core: #182334; --zone-partial: #2c2318; --zone-out: #151b23;
  --tx: #1c2a44; --loop: #1b2b1e; --select: #7ea2ff; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1420px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 32px; }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { display: block; overflow: visible; }

/* Tabs */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border: 1px solid var(--border); border-radius: 10px; justify-self: start; }
.tab { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 6px 16px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tab:focus-visible, .flow-btn:focus-visible, .node:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }

/* Views */
.view { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.view.arch { grid-template-columns: minmax(0, 1fr) 320px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.diagram { padding: 18px; display: grid; gap: 12px; }
.diagram-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.diagram-head p { margin: 4px 0 0; color: var(--muted); max-width: 90ch; }
.scroll { overflow-x: auto; }
.scroll svg { display: block; color: var(--ink); }
.notes { margin: 0; padding-left: 18px; color: var(--ink); display: grid; gap: 4px; font-size: 13.5px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
.sources code { font-family: var(--mono); font-size: 11.5px; background: var(--soft); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--ink); }

/* Flow list */
.flow-list { padding: 10px; display: grid; gap: 2px; position: sticky; top: 20px; }
.flow-group { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.flow-btn { font: inherit; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 10px; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.flow-btn:hover { background: var(--soft); }
.flow-btn[aria-current="true"] { background: var(--soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--select); }
.flow-btn .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* Architecture panel */
.panel { padding: 18px; display: grid; gap: 12px; position: sticky; top: 20px; }
.panel h3 { margin: 0; font-size: 16px; }
.panel .kind { font-size: 12px; color: var(--muted); }
.panel p { margin: 0; }
.links { display: grid; gap: 6px; }
.link-row { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 13px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.link-row b { font-weight: 600; }
.link-row span { color: var(--muted); grid-column: 1 / -1; }
.muted { color: var(--muted); }

/* SVG marks */
.zone rect { stroke: var(--border); stroke-width: 1; }
.zone text { font-size: 12px; font-weight: 600; fill: var(--muted); letter-spacing: .04em; }
.zone text.zone-sub { font-size: 11px; font-weight: 500; letter-spacing: 0; }
.z-core rect { fill: var(--zone-core); }
.z-partial rect { fill: var(--zone-partial); }
.z-out rect { fill: var(--zone-out); stroke-dasharray: 5 4; }
.shape { fill: var(--card); stroke: var(--ink); stroke-width: 1.3; }
.shape.ext { stroke-dasharray: 4 3; }
.shape.part { fill: var(--soft); stroke: var(--muted); }
.node text, .head text { font-size: 13px; font-weight: 600; fill: var(--ink); }
.node .sub, .head .sub { font-size: 10.5px; font-weight: 500; fill: var(--muted); }
.node { cursor: pointer; }
.node.sel .shape { stroke: var(--select); stroke-width: 2.4; }
svg.has-sel .node:not(.sel):not(.rel) { opacity: .35; }
svg.has-sel .edge:not(.on) { opacity: .12; }
.edge path { fill: none; stroke-width: 2.4; stroke: var(--c); }
.edge.async path { stroke-dasharray: 8 5; }
.ch-http { --c: var(--c-http); } .ch-sql { --c: var(--c-sql); } .ch-s3 { --c: var(--c-s3); }
.ch-queue { --c: var(--c-queue); } .ch-run { --c: var(--c-run); } .ch-inproc { --c: var(--c-inproc); } .ch-ret { --c: var(--muted); }
/* Flowing dashes show direction: on the selected component, or everywhere when the flow toggle is on. */
.edge path.flow { stroke-dasharray: 0.1 18; stroke-width: 6; stroke-linecap: round; opacity: 0; stroke: var(--c); }
#arch.animate .edge path.flow, #arch.has-sel .edge.on path.flow { opacity: .95; animation: dash .9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18.1; } }
.edge text, .msg text { font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }

.badge circle { fill: var(--c); stroke: var(--card); stroke-width: 2; }
.badge text { font-size: 11px; font-weight: 700; font-family: var(--mono); stroke-width: 0; fill: var(--card); }
.ch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ch-table th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.ch-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.ch-table tr:last-child td { border-bottom: 0; }
.ch-table td.no { font-family: var(--mono); font-size: 12px; width: 36px; }
.ch-table td.no span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--card); font-weight: 700; }
.ch-table td.ch b { color: var(--c); }
.ch-table td.ch { white-space: nowrap; font-weight: 600; }
.ch-table.has-sel tr:not(.on) { opacity: .35; }
.lifeline { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .85; }
.msg path { fill: none; stroke-width: 2.2; stroke: var(--c); }
.msg.return path { stroke-dasharray: 5 4; stroke-width: 1.6; }
.msg.async path { stroke-dasharray: 8 5; }
.msg text { fill: var(--ink); }
.msg.return text { fill: var(--muted); }
/* Playback: future steps fade, the current step thickens, a packet travels along it. */
svg.playing .msg.future, svg.playing .step-no.future, svg.playing .fail.future { opacity: .14; }
svg.playing .msg.active path:not(.flow) { stroke-width: 3.4; }
/* Flowing dots along arrows, same as the architecture view. */
.msg path.flow { stroke-dasharray: 0.1 18; stroke-width: 6; stroke-linecap: round; opacity: 0; }
svg.animate .msg path.flow, svg.playing .msg.active path.flow { opacity: .95; animation: dash .9s linear infinite; }
svg.animate.playing .msg.future path.flow { opacity: 0; }
svg.playing .step-no.active circle { fill: var(--c, var(--select)); stroke: none; }
svg.playing .step-no.active text { fill: var(--card); font-weight: 700; }
.packet { fill: var(--c); stroke: var(--card); stroke-width: 2.5; }
.player { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.player button, .anim-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
.player button.primary, .anim-btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.player button:focus-visible, .anim-btn:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }
.player .pos { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #arch .edge path.flow, .msg path.flow { animation: none !important; } }
.step-no circle { fill: var(--soft); stroke: var(--border); }
.step-no text { font-size: 10.5px; font-family: var(--mono); fill: var(--muted); text-anchor: middle; }
.block rect.bg { stroke: none; }
.block.tx rect.bg { fill: var(--tx); }
.block.loop rect.bg { fill: var(--loop); }
.block text { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .03em; }
.block.tx text { paint-order: stroke; stroke: var(--tx); stroke-width: 6px; stroke-linejoin: round; }
.block.loop text { paint-order: stroke; stroke: var(--loop); stroke-width: 6px; stroke-linejoin: round; }
.fail rect { fill: var(--fail-bg); }
.fail text { font-size: 12px; fill: var(--fail); font-weight: 500; }
.col-head { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .05em; }

@media (max-width: 1100px) {
  .view, .view.arch { grid-template-columns: 1fr; }
  .flow-list, .panel { position: static; }
  .flow-list { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .flow-group { grid-column: 1 / -1; }
}
@media (max-width: 620px) { h1 { font-size: 22px; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="page-title"></h1>
      <p class="sub">Thành phần, kênh giao tiếp và các bước xử lý theo từng luồng.</p>
    </div>
    <div class="legend" id="legend" aria-label="Chú thích"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Chế độ xem">
    <button type="button" class="tab" role="tab" id="tab-kien-truc" aria-controls="view-kien-truc" data-view="kien-truc">Kiến trúc</button>
    <button type="button" class="tab" role="tab" id="tab-luong-request" aria-controls="view-luong-request" data-view="luong-request">Luồng request</button>
    <button type="button" class="tab" role="tab" id="tab-tinh-nang" aria-controls="view-tinh-nang" data-view="tinh-nang">Tính năng</button>
  </div>

  <section class="view arch" id="view-kien-truc" role="tabpanel" aria-labelledby="tab-kien-truc">
    <div class="card diagram">
      <div class="diagram-head">
        <h2>Kiến trúc tổng thể</h2>
        <p>Chọn một thành phần để xem vai trò và kênh giao tiếp. Số trên đường nối khớp với bảng bên dưới.</p>
      </div>
      <div class="player"><button type="button" class="anim-btn" id="arch-anim" aria-pressed="true">Tắt dòng chảy</button></div>
      <div class="scroll"><svg id="arch" class="animate" role="img" aria-label="Thành phần của hệ thống theo vùng tin cậy và kênh giao tiếp giữa chúng"></svg></div>
      <div class="scroll"><table class="ch-table" id="ch-table"><thead><tr><th>#</th><th>Từ → Tới</th><th>Kênh</th><th>Nội dung</th></tr></thead><tbody></tbody></table></div>
      <div class="sources" id="arch-sources"></div>
    </div>
    <aside class="card panel" id="arch-panel" aria-live="polite"></aside>
  </section>

  <section class="view" id="view-luong-request" role="tabpanel" aria-labelledby="tab-luong-request" hidden>
    <nav class="card flow-list" aria-label="Luồng request"></nav>
    <div class="card diagram flow-view"></div>
  </section>

  <section class="view" id="view-tinh-nang" role="tabpanel" aria-labelledby="tab-tinh-nang" hidden>
    <nav class="card flow-list" aria-label="Tính năng"></nav>
    <div class="card diagram flow-view"></div>
  </section>
</div>

<script>
// Everything runs inside one function so no name collides with globals of the host page.
(() => {
// Data block. Edit CONFIG, COMPONENTS, LINKS, ZONES and FLOWS only; the drawing code below stays fixed.
// COMPONENTS.shape: proc = process, store = data store, ext = outside the system, part = layer inside one process (no x, y).
// COMPONENTS.zone: id in ZONES. x, y: top-left on the architecture diagram, node size 140 x 46.
// LINKS.ch: http | sql | s3 | queue | run, sets the color. kind: sync | async (dashed). via: bend points, badge: badge position.
// FLOWS.tab: luong-request | tinh-nang. step type: call | return | async | self. fail: only when a document states it.
// FLOWS.blocks: { type: tx | loop, label, from, to } with 1-based step numbers.
const CONFIG = { title: "Luồng hệ thống TÊN_DỰ_ÁN", archSources: ["system.md"] };
const COMPONENTS = [
  { id: "br", name: "Trình duyệt", shape: "ext", zone: "out", x: 24, y: 240, role: "Giao diện người dùng. Ví dụ mẫu." },
  { id: "api", name: "Backend API", shape: "proc", zone: "core", x: 260, y: 240, code: "backend/", role: "REST API. Ví dụ mẫu." },
  { id: "pg", name: "PostgreSQL", shape: "store", zone: "core", x: 500, y: 240, role: "Dữ liệu nghiệp vụ. Ví dụ mẫu." },
];
const LINKS = [
  { from: "br", to: "api", ch: "http", kind: "sync", label: "HTTPS", detail: "Request REST" },
  { from: "api", to: "pg", ch: "sql", kind: "sync", label: "SQL", detail: "Đọc, ghi dữ liệu" },
];
const ZONES = [
  { id: "out", name: "BÊN NGOÀI", sub: "không tin cậy", cls: "z-out", x: 10, y: 190, w: 172, h: 140 },
  { id: "core", name: "VÙNG LÕI", sub: "tin cậy", cls: "z-core", x: 220, y: 190, w: 460, h: 140 },
];
const FLOWS = [
  { id: "request", tab: "luong-request", group: "Request", title: "Gửi request",
    summary: "Ví dụ mẫu: request REST đi qua Backend API.",
    parts: ["br", "api", "pg"],
    steps: [
      { from: "br", to: "api", type: "call", text: "GET /items" },
      { from: "api", to: "api", type: "self", text: "Kiểm tra quyền", fail: "403 forbidden" },
      { from: "api", to: "pg", type: "call", text: "Đọc item" },
      { from: "api", to: "br", type: "return", text: "Danh sách item" },
    ],
    blocks: [], notes: ["Ví dụ mẫu, thay bằng dữ liệu thật."], sources: ["request-flow.md"] },
  { id: "create-item", tab: "tinh-nang", group: "Item", title: "Tạo item",
    summary: "Ví dụ mẫu: tạo một item.",
    parts: ["br", "api", "pg"],
    steps: [
      { from: "br", to: "api", type: "call", text: "POST /items" },
      { from: "api", to: "pg", type: "call", text: "Ghi item" },
      { from: "api", to: "br", type: "return", text: "Item vừa tạo" },
    ],
    blocks: [{ type: "tx", label: "MỘT TRANSACTION", from: 2, to: 2 }], notes: [], sources: ["business-flow.md"] },
];

// ---- Drawing code: fixed encoding, see SKILL.md of drawing-system-flows ----
const NS = "http://www.w3.org/2000/svg";
const comp = Object.fromEntries(COMPONENTS.map(c => [c.id, c]));

// Validate data before drawing; problems are listed at the top of the page.
(function validate() {
  const errors = [], zones = new Set(ZONES.map(z => z.id)), seen = new Set();
  COMPONENTS.forEach(c => {
    if (seen.has(c.id)) errors.push(`Trùng id thành phần: ${c.id}`);
    seen.add(c.id);
    if (!["proc", "store", "ext", "part"].includes(c.shape)) errors.push(`${c.id}: shape sai`);
    if (!zones.has(c.zone)) errors.push(`${c.id}: zone "${c.zone}" không có trong ZONES`);
    if (c.shape !== "part" && (c.x === undefined || c.y === undefined)) errors.push(`${c.id}: thiếu x, y`);
  });
  LINKS.forEach((l, i) => {
    if (!comp[l.from] || !comp[l.to]) errors.push(`LINKS[${i}]: thành phần không tồn tại`);
    if (!["http", "sql", "s3", "queue", "run"].includes(l.ch)) errors.push(`LINKS[${i}]: ch sai`);
  });
  const flowIds = new Set();
  FLOWS.forEach(f => {
    if (flowIds.has(f.id)) errors.push(`Trùng id luồng: ${f.id}`);
    flowIds.add(f.id);
    if (!["luong-request", "tinh-nang"].includes(f.tab)) errors.push(`${f.id}: tab sai`);
    f.parts.forEach(p => { if (!comp[p]) errors.push(`${f.id}: thành phần "${p}" không tồn tại`); });
    f.steps.forEach((s, i) => {
      if (!f.parts.includes(s.from) || !f.parts.includes(s.to)) errors.push(`${f.id} bước ${i + 1}: from, to không có trong parts`);
      if (!["call", "return", "async", "self"].includes(s.type)) errors.push(`${f.id} bước ${i + 1}: type sai`);
      if ((s.type === "self") !== (s.from === s.to)) errors.push(`${f.id} bước ${i + 1}: self phải có from bằng to`);
    });
    f.blocks.forEach(b => { if (b.from < 1 || b.to > f.steps.length || b.from > b.to) errors.push(`${f.id}: khối ${b.label} sai số bước`); });
    if (f.notes.length > 3) errors.push(`${f.id}: quá 3 ghi chú`);
  });
  ["luong-request", "tinh-nang"].forEach(t => { if (!FLOWS.some(f => f.tab === t)) errors.push(`Tab ${t} chưa có luồng nào`); });
  COMPONENTS.forEach(c => {
    const used = LINKS.some(l => l.from === c.id || l.to === c.id) || FLOWS.some(f => f.parts.includes(c.id));
    if (!used) errors.push(`${c.id}: không có đường nối hay luồng nào dùng`);
  });
  if (errors.length) {
    const box = document.createElement("pre");
    box.style.cssText = "background:var(--fail-bg);color:var(--ink);border:1.5px solid var(--fail);border-radius:8px;padding:12px;white-space:pre-wrap;margin:0";
    box.textContent = "Dữ liệu sai:\n" + errors.join("\n");
    document.querySelector(".wrap").prepend(box);
    throw new Error(errors.join("; "));
  }
})();
document.getElementById("page-title").textContent = CONFIG.title;
document.getElementById("arch-sources").innerHTML = "Nguồn: " + CONFIG.archSources.map(x => `<code>${x}</code>`).join("");
const SHAPE_NAME = { proc: "Tiến trình", store: "Kho dữ liệu", ext: "Bên ngoài hệ thống", part: "Lớp trong một tiến trình" };
function el(tag, attrs, parent) {

    t.tabIndex = x === v ? 0 : -1;

}
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => showView(t.dataset.view));
  t.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = VIEWS.indexOf(t.dataset.view), n = VIEWS[(i + (e.key === "ArrowRight" ? 1 : VIEWS.length - 1)) % VIEWS.length];
    showView(n);
    document.getElementById("tab-" + n).focus();
  });
});
window.addEventListener("hashchange", () => showView(location.hash.slice(1)));
showView(location.hash.slice(1));
})();
