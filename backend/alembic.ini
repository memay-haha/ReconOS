# Two databases, two migration trees. Run both from the repo root:
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini -n log upgrade head
# The URL is not written here: env.py builds it from RECONOS_* settings so no
# credential sits in the repo.

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
path_separator = os
timezone = UTC

[log]
script_location = backend/migrations_log
prepend_sys_path = backend
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
