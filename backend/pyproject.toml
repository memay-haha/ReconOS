# Backend runs as 4 processes: API, dispatcher, background, Celery Beat.
# Roles: docs/architecture/system.md
[project]
name = "reconos-backend"
version = "0.1.0"
description = "ReconOS backend: API, dispatcher, background tasks, parsers"
requires-python = ">=3.15"
dependencies = [
    "aioboto3",
    "alembic>=1",
    "argon2-cffi",
    "asyncpg",
    "celery[redis]>=5",
    "cryptography",
    "fastapi",
    "pydantic>=2",
    "pydantic-settings>=2",
    "reconos-contracts",
    "redis",
    "sqlalchemy[asyncio]>=2",
    "structlog",
    "uvicorn[standard]",
]

[tool.uv.sources]
reconos-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
