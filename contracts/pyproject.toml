# Shared worker <-> backend contract. No logic, no database models.
[project]
name = "reconos-contracts"
version = "0.1.0"
description = "Pydantic schemas and constants shared by backend and workers"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
