<!-- Subtle Background Coordinate Mesh & Radial Halos -->
<div class="pointer-events-none absolute -top-40 -left-36 w-96 h-96 rounded-full bg-primary/10 blur-[120px]"></div>
<div class="pointer-events-none absolute -bottom-40 -right-36 w-96 h-96 rounded-full bg-asset-service/10 blur-[130px]"></div>
<!-- Decorative Technical Coordinate Overlays -->

<!-- Main Login Card (Exact 392px standard) -->
<div class="relative w-full max-w-[392px] mx-auto z-10">
<!-- Outer Card Glow Accent Line -->
<div class="h-1 w-full bg-gradient-to-r from-transparent via-primary to-transparent rounded-t-xl opacity-80"></div>
<div class="bg-surface rounded-b-xl rounded-t-none p-7 sm:p-8 shadow-2xl shadow-black/80 flex flex-col relative">
<!-- Card Header: Tactical Radar Icon & Telemetry -->

<!-- Title & Descriptor -->
<div class="mb-6">
<h1 class="font-headline-lg text-headline-lg text-fg tracking-tight mb-1.5">Sign In</h1>
<p class="font-body-default text-body-default text-fg-muted">Enter your credentials to access the console.</p>
</div>
<!-- Interactive Alert State Toggle (Security Operations Simulation) -->

<!-- Authentication Form -->
<form class="flex flex-col gap-4.5" id="loginForm" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Field 1: Operator ID -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps uppercase text-fg-muted tracking-wider" for="operatorId">Username</label>

</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-[18px] text-fg-faint pointer-events-none">terminal</span>
<input class="w-full h-9 pl-9 pr-3 rounded bg-surface-2 text-fg font-body-code text-body-code placeholder:text-fg-faint focus:outline-none focus:ring-2 focus:ring-primary/40 focus:bg-surface-3 transition-colors" id="operatorId" name="operatorId" placeholder="e.g. operator_01" required="" type="text" value="operator_01">
</div>
</div>
<!-- Field 2: Secret / Token Pass -->
<div class="flex flex-col gap-1.5 mt-1">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps uppercase text-fg-muted tracking-wider" for="operatorKey">Password</label>

</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-[18px] text-fg-faint pointer-events-none">key</span>
<input class="w-full h-9 pl-9 pr-10 rounded bg-surface-2 text-fg font-body-code text-body-code placeholder:text-fg-faint focus:outline-none focus:ring-2 focus:ring-primary/40 focus:bg-surface-3 transition-colors" id="operatorKey" name="operatorKey" placeholder="••••••••••••••••" required="" type="password" value="recon-delta-99201">
<button aria-label="Toggle password visibility" class="absolute right-2.5 text-fg-faint hover:text-fg transition-colors p-1 flex items-center justify-center" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Session Persistence & Hardware Token Flags -->

<!-- Primary Action Trigger -->
<button class="w-full h-[42px] mt-2 rounded bg-primary-container hover:bg-accent-hover active:bg-primary-fixed-dim text-accent-ink font-body-code-bold text-body-default tracking-wide shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2 transition-all duration-150" id="submitBtn" type="submit">Sign In</button>
</form>
<!-- Hardware Token / SSO Quick Dispatcher -->

<!-- Security Notice Banner -->

<!-- Card Internal Telemetry Footer -->

</div>
</div>
<!-- External Helper Links & Operator Console Quick Support -->

</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('operatorKey');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function toggleSimulatedError() {
    const alertBox = document.getElementById('authAlert');
    alertBox.classList.toggle('hidden');
  }

  function triggerAuth() {
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    
    // Simulate loading state
    btn.disabled = true;
    btn.classList.add('opacity-80', 'cursor-wait');
    btnText.textContent = 'Authenticating Cluster Handshake...';
    btnIcon.classList.add('animate-spin');
    btnIcon.textContent = 'progress_activity';

    setTimeout(() => {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-wait');
      btnText.textContent = 'Sign In to ReconOS';
      btnIcon.classList.remove('animate-spin');
      btnIcon.textContent = 'login';
      
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.remove('hidden');
    }, 1200);
  }
</script></main><footer class="fixed bottom-0 left-0 right-0 z-20 h-10 px-margin flex items-center justify-between pointer-events-none"><div class="w-full flex items-center justify-between text-caption font-body-code text-fg-faint pointer-events-auto"><span class="">© ReconOS Security Systems</span><span class="">All connections encrypted</span></div></footer>
