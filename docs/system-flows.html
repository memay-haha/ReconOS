<style>
/* Layout: tabs on top; each tab is a diagram card plus a side panel, stacked on narrow screens. */
:root {
  --bg: #f3f5f8;
  --card: #ffffff;
  --ink: #142033;
  --muted: #64718a;
  --border: #dfe4ec;
  --soft: #eef1f6;
  --async: #7a4fd6;
  --c-http: #2563eb;
  --c-sql: #0e8a5f;
  --c-s3: #c06a00;
  --c-queue: #7a4fd6;
  --c-run: #c62f3b;
  --c-inproc: #142033;
  --fail: #c62f3b;
  --fail-bg: #fdecee;
  --zone-core: #eaf0f8;
  --zone-partial: #fbf1e4;
  --zone-out: #f6f7f9;
  --tx: #e3ecfb;
  --loop: #eef6ea;
  --select: #2457d6;
  --shadow: 0 1px 2px rgba(20, 32, 51, .06), 0 4px 14px rgba(20, 32, 51, .06);
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #8e9ab0; --border: #283242; --soft: #1d2531;
    --c-http: #7aa7ff; --c-sql: #4cc893; --c-s3: #f2a84e; --c-queue: #b49bff; --c-run: #ff7b86; --c-inproc: #e6ebf2; --async: #b49bff; --fail: #ff7b86; --fail-bg: #3a1c21; --zone-core: #182334; --zone-partial: #2c2318; --zone-out: #151b23;
    --tx: #1c2a44; --loop: #1b2b1e; --select: #7ea2ff; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #8e9ab0; --border: #283242; --soft: #1d2531;
  --c-http: #7aa7ff; --c-sql: #4cc893; --c-s3: #f2a84e; --c-queue: #b49bff; --c-run: #ff7b86; --c-inproc: #e6ebf2; --async: #b49bff; --fail: #ff7b86; --fail-bg: #3a1c21; --zone-core: #182334; --zone-partial: #2c2318; --zone-out: #151b23;
  --tx: #1c2a44; --loop: #1b2b1e; --select: #7ea2ff; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1420px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 32px; }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { display: block; overflow: visible; }

/* Tabs */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--soft); border: 1px solid var(--border); border-radius: 10px; justify-self: start; }
.tab { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 6px 16px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tab:focus-visible, .flow-btn:focus-visible, .node:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }

/* Views */
.view { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.view.arch { grid-template-columns: minmax(0, 1fr) 320px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.diagram { padding: 18px; display: grid; gap: 12px; }
.diagram-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.diagram-head p { margin: 4px 0 0; color: var(--muted); max-width: 90ch; }
.scroll { overflow-x: auto; }
.scroll svg { display: block; color: var(--ink); }
.notes { margin: 0; padding-left: 18px; color: var(--ink); display: grid; gap: 4px; font-size: 13.5px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
.sources code { font-family: var(--mono); font-size: 11.5px; background: var(--soft); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--ink); }

/* Flow list */
.flow-list { padding: 10px; display: grid; gap: 2px; position: sticky; top: 20px; }
.flow-group { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.flow-btn { font: inherit; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 10px; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.flow-btn:hover { background: var(--soft); }
.flow-btn[aria-current="true"] { background: var(--soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--select); }
.flow-btn .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* Architecture panel */
.panel { padding: 18px; display: grid; gap: 12px; position: sticky; top: 20px; }
.panel h3 { margin: 0; font-size: 16px; }
.panel .kind { font-size: 12px; color: var(--muted); }
.panel p { margin: 0; }
.links { display: grid; gap: 6px; }
.link-row { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 13px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
.link-row b { font-weight: 600; }
.link-row span { color: var(--muted); grid-column: 1 / -1; }
.muted { color: var(--muted); }

/* SVG marks */
.zone rect { stroke: var(--border); stroke-width: 1; }
.zone text { font-size: 12px; font-weight: 600; fill: var(--muted); letter-spacing: .04em; }
.zone text.zone-sub { font-size: 11px; font-weight: 500; letter-spacing: 0; }
.z-core rect { fill: var(--zone-core); }
.z-partial rect { fill: var(--zone-partial); }
.z-out rect { fill: var(--zone-out); stroke-dasharray: 5 4; }
.shape { fill: var(--card); stroke: var(--ink); stroke-width: 1.3; }
.shape.ext { stroke-dasharray: 4 3; }
.shape.part { fill: var(--soft); stroke: var(--muted); }
.node text, .head text { font-size: 13px; font-weight: 600; fill: var(--ink); }
.node .sub, .head .sub { font-size: 10.5px; font-weight: 500; fill: var(--muted); }
.node { cursor: pointer; }
.node.sel .shape { stroke: var(--select); stroke-width: 2.4; }
svg.has-sel .node:not(.sel):not(.rel) { opacity: .35; }
svg.has-sel .edge:not(.on) { opacity: .12; }
.edge path { fill: none; stroke-width: 2.4; stroke: var(--c); }
.edge.async path { stroke-dasharray: 8 5; }
.ch-http { --c: var(--c-http); } .ch-sql { --c: var(--c-sql); } .ch-s3 { --c: var(--c-s3); }
.ch-queue { --c: var(--c-queue); } .ch-run { --c: var(--c-run); } .ch-inproc { --c: var(--c-inproc); } .ch-ret { --c: var(--muted); }
/* Flowing dashes show direction: on the selected component, or everywhere when the flow toggle is on. */
.edge path.flow { stroke-dasharray: 0.1 18; stroke-width: 6; stroke-linecap: round; opacity: 0; stroke: var(--c); }
#arch.animate .edge path.flow, #arch.has-sel .edge.on path.flow { opacity: .95; animation: dash .9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18.1; } }
.edge text, .msg text { font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; }

.badge circle { fill: var(--c); stroke: var(--card); stroke-width: 2; }
.badge text { font-size: 11px; font-weight: 700; font-family: var(--mono); stroke-width: 0; fill: var(--card); }
.ch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ch-table th { text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.ch-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.ch-table tr:last-child td { border-bottom: 0; }
.ch-table td.no { font-family: var(--mono); font-size: 12px; width: 36px; }
.ch-table td.no span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--card); font-weight: 700; }
.ch-table td.ch b { color: var(--c); }
.ch-table td.ch { white-space: nowrap; font-weight: 600; }
.ch-table.has-sel tr:not(.on) { opacity: .35; }
.lifeline { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .85; }
.msg path { fill: none; stroke-width: 2.2; stroke: var(--c); }
.msg.return path { stroke-dasharray: 5 4; stroke-width: 1.6; }
.msg.async path { stroke-dasharray: 8 5; }
.msg text { fill: var(--ink); }
.msg.return text { fill: var(--muted); }
/* Playback: future steps fade, the current step thickens, a packet travels along it. */
svg.playing .msg.future, svg.playing .step-no.future, svg.playing .fail.future { opacity: .14; }
svg.playing .msg.active path:not(.flow) { stroke-width: 3.4; }
/* Flowing dots along arrows, same as the architecture view. */
.msg path.flow { stroke-dasharray: 0.1 18; stroke-width: 6; stroke-linecap: round; opacity: 0; }
svg.animate .msg path.flow, svg.playing .msg.active path.flow { opacity: .95; animation: dash .9s linear infinite; }
svg.animate.playing .msg.future path.flow { opacity: 0; }
svg.playing .step-no.active circle { fill: var(--c, var(--select)); stroke: none; }
svg.playing .step-no.active text { fill: var(--card); font-weight: 700; }
.packet { fill: var(--c); stroke: var(--card); stroke-width: 2.5; }
.player { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.player button, .anim-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
.player button.primary, .anim-btn[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.player button:focus-visible, .anim-btn:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }
.player .pos { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #arch .edge path.flow, .msg path.flow { animation: none !important; } }
.step-no circle { fill: var(--soft); stroke: var(--border); }
.step-no text { font-size: 10.5px; font-family: var(--mono); fill: var(--muted); text-anchor: middle; }
.block rect.bg { stroke: none; }
.block.tx rect.bg { fill: var(--tx); }
.block.loop rect.bg { fill: var(--loop); }
.block text { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .03em; }
.block.tx text { paint-order: stroke; stroke: var(--tx); stroke-width: 6px; stroke-linejoin: round; }
.block.loop text { paint-order: stroke; stroke: var(--loop); stroke-width: 6px; stroke-linejoin: round; }
.fail rect { fill: var(--fail-bg); }
.fail text { font-size: 12px; fill: var(--fail); font-weight: 500; }
.col-head { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .05em; }

@media (max-width: 1100px) {
  .view, .view.arch { grid-template-columns: 1fr; }
  .flow-list, .panel { position: static; }
  .flow-list { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .flow-group { grid-column: 1 / -1; }
}
@media (max-width: 620px) { h1 { font-size: 22px; } }
</style>

<script>
// Everything runs inside one function so no name collides with globals of the host page.
(() => {
// Data block. To redraw after the architecture or a flow changes, edit COMPONENTS, LINKS and FLOWS only.

const COMPONENTS = [
  { id: "br", name: "Trình duyệt", shape: "ext", zone: "out", x: 24, y: 240, role: "Giao diện người dùng. Không tin cậy: backend xác thực và phân quyền mọi request." },
  { id: "px", name: "Reverse proxy", shape: "proc", zone: "core", x: 210, y: 240, code: "infras/", role: "Giải mã TLS, giới hạn kích thước body, định tuyến tới frontend và Backend API." },

  { id: "beat", name: "Celery Beat", shape: "proc", zone: "core", x: 870, y: 370, code: "backend/", role: "Gửi task vào queue schedule theo lịch. Không tạo job, không giao job." },
  { id: "pg", name: "PostgreSQL", shape: "store", zone: "core", x: 640, y: 240, role: "Program, scope, tài sản, job, finding, metadata output thô, tài khoản, nhật ký thao tác. CSDL reconos_log chứa log ứng dụng." },

// ---- Architecture ----
const NODE_W = 140, NODE_H = 46;
const archSvg = document.getElementById("arch");

const archNodes = {}, archEdges = [];

(function drawArch() {
  const W = 1250, H = 556;
  archSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    if (py >= c.y && py <= c.y + NODE_H) return [px < c.x ? c.x : c.x + NODE_W, py];

    const cx = c.x + NODE_W / 2, cy = c.y + NODE_H / 2, dx = px - cx, dy = py - cy;

  LINKS.forEach(l => {
    const a = comp[l.from], b = comp[l.to];

    let best = 0, mid = pts[0];
    for (let i = 1; i < pts.length; i++) {

    }

    const n = archEdges.length + 1;
    const lg = el("g", { class: `edge badge ch-${l.ch}` }, labelLayer);
    el("circle", { cx: mid[0], cy: mid[1], r: 10 }, lg);
    text(lg, mid[0], mid[1] + 4, String(n), { "text-anchor": "middle" });

})();
const animBtn = document.getElementById("arch-anim");
animBtn.addEventListener("click", () => {

const chBody = document.querySelector("#ch-table tbody");

function selectArch(id) {

// ---- Sequence diagrams ----
// Wrap a label so it never runs past its arrow. Canvas measuring works even while the tab is hidden.
const measureCtx = document.createElement("canvas").getContext("2d");
measureCtx.font = '12px "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';
function wrap(str, maxW) {
  const words = str.split(" "), lines = [];
  let line = "";
  words.forEach(w => {
    const next = line ? line + " " + w : w;
    if (line && measureCtx.measureText(next).width > maxW) { lines.push(line); line = w; } else line = next;
  });
  if (line) lines.push(line);
  return lines;
}
const LINE_H = 14;
function drawFlow(svg, f) {
  svg.innerHTML = "";
  const COL = f.parts.length >= 7 ? 124 : f.parts.length >= 6 ? 138 : 156, LEFT = 46, TOP = 12, HEAD = 46, ROW = 40, BLOCK_PAD = 26;
  const FAIL_W = Math.max(110, 30 + 7.2 * Math.max(0, ...f.steps.map(x => (x.fail || "").length)));
  const xs = Object.fromEntries(f.parts.map((p, i) => [p, LEFT + COL / 2 + i * COL]));
  const lastX = LEFT + COL * f.parts.length;
  const W = lastX + FAIL_W + 10;
  // Vertical layout with extra room where a block starts or ends.
  const startAt = {}, endAt = {};
  f.blocks.forEach(b => { (startAt[b.from] ||= []).push(b); (endAt[b.to] ||= []).push(b); });
  let y = TOP + HEAD + 26;
  const rowY = [];
  const SELF_W = COL - 46;
  const linesOf = f.steps.map(s => wrap(s.text, s.type === "self" ? SELF_W : Math.abs(xs[s.to] - xs[s.from]) - 18));
  f.steps.forEach((s, i) => {
    const n = i + 1, extra = (linesOf[i].length - 1) * LINE_H;
    if (startAt[n]) y += BLOCK_PAD;
    // Arrow labels stack above the arrow; self labels stack below the loop start.
    if (s.type !== "self") y += extra;
    rowY[n] = y;
    y += s.type === "self" ? ROW + 6 + extra : ROW;
    if (endAt[n]) y += 8;
  });
  const H = y + 10;
  const stepEls = [];
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  markers(svg, "s" + f.id);

  const blockLabels = [];
  f.blocks.forEach(b => {
    const g = el("g", { class: `block ${b.type}` }, svg);
    const first = f.steps[b.from - 1], last = f.steps[b.to - 1];
    const above = first.type === "self" ? 0 : (linesOf[b.from - 1].length - 1) * LINE_H;
    const below = last.type === "self" ? (linesOf[b.to - 1].length - 1) * LINE_H : 0;
    const y1 = rowY[b.from] - above - BLOCK_PAD + 4, y2 = rowY[b.to] + below + (last.type === "self" ? ROW : ROW - 8);
    el("rect", { class: "bg", x: LEFT + 6, y: y1, width: lastX - LEFT - 12, height: y2 - y1, rx: 8 }, g);
    blockLabels.push(() => {
      const lg = el("g", { class: `block ${b.type}` }, svg);
      measureCtx.font = '600 11px "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';
      const w = measureCtx.measureText(b.label).width + b.label.length * 0.4 + 12;
      measureCtx.font = '12px "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';
      el("rect", { class: "bg", x: LEFT + 10, y: y1 + 3, width: w, height: 16, rx: 4 }, lg);
      text(lg, LEFT + 16, y1 + 15, b.label);
    });
  });

  f.parts.forEach(p => {
    el("line", { class: "lifeline", x1: xs[p], x2: xs[p], y1: TOP + HEAD, y2: H - 6 }, svg);
    const g = el("g", { class: "head" }, svg);
    drawShape(g, comp[p], xs[p] - (COL - 24) / 2, TOP, COL - 24, HEAD - 6);
  });
  // Block labels go above the lifelines so the dashed lines never cut through them.
  blockLabels.forEach(draw => draw());
  f.steps.forEach((s, i) => {
    const n = i + 1, yy = rowY[n];
    const ch = chOf(s);
    const no = el("g", { class: `step-no ch-${ch}` }, svg);
    el("circle", { cx: 20, cy: yy, r: 10 }, no);
    text(no, 20, yy + 3.5, String(n));
    const g = el("g", { class: `msg ${s.type} ch-${ch}` }, svg);
    const x1 = xs[s.from], x2 = xs[s.to];
    let path;
    if (s.type === "self") {
      path = el("path", { d: `M${x1},${yy - 6} H${x1 + 26} V${yy + 12} H${x1 + 4}`, "marker-end": `url(#s${f.id}-${ch})` }, g);
      el("path", { d: path.getAttribute("d"), class: "flow" }, g);
      linesOf[i].forEach((ln, k) => text(g, x1 + 34, yy + 7 + k * LINE_H, ln));
    } else {
      const dir = x2 > x1 ? 1 : -1;
      path = el("path", { d: `M${x1 + dir * 3},${yy + 6} H${x2 - dir * 4}`, "marker-end": `url(#s${f.id}-${ch})` }, g);
      el("path", { d: path.getAttribute("d"), class: "flow" }, g);
      const ls = linesOf[i];
      ls.forEach((ln, k) => text(g, (x1 + x2) / 2, yy - (ls.length - 1 - k) * LINE_H, ln, { "text-anchor": "middle" }));
    }
    const parts = [no, g];
    if (s.fail) {
      const fg = el("g", { class: "fail" }, svg);
      parts.push(fg);
      const t = text(fg, lastX + 22, yy + 4, s.fail);
      const w = s.fail.length * 7.2;
      const r = el("rect", { x: lastX + 14, y: yy - 9, width: w + 16, height: 20, rx: 5 }, fg);
      fg.insertBefore(r, t);
      el("line", { x1: (s.type === "self" ? x1 + 34 : Math.max(x1, x2)) + 6, x2: lastX + 10, y1: yy + 1, y2: yy + 1, style: "stroke:var(--fail);stroke-width:1;stroke-dasharray:1 4;opacity:.6" }, fg);
    }

}
// Color of a message follows its channel, taken from LINKS so no component id is hard-coded.
function chOf(s) {
  if (s.type === "return") return "ret";
  if (s.type === "async") return "queue";
  if (s.type === "self") return "inproc";
  const link = LINKS.find(l => (l.from === s.from && l.to === s.to) || (l.from === s.to && l.to === s.from));
  if (link) return link.ch;
  const a = comp[s.from], b = comp[s.to];
  const store = [a, b].find(c => c.shape === "store");
  if (store) {
    // A store is reached through one kind of channel; use the most common one among its links.
    const count = {};
    LINKS.filter(l => l.from === store.id || l.to === store.id).forEach(l => { count[l.ch] = (count[l.ch] || 0) + 1; });
    return Object.keys(count).sort((x, y) => count[y] - count[x])[0] || "http";

// Playback: steps light up one by one while a packet travels along each arrow.
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function makePlayer(svg, steps, ui) {
  let cur = -1, timer = null, raf = null, playing = false;
  const packet = el("circle", { class: "packet", r: 6, cx: -20, cy: -20 }, svg);
  function paint() {
    svg.classList.toggle("playing", cur >= 0);
    steps.forEach((st, i) => st.parts.forEach(p => {
      p.classList.toggle("future", cur >= 0 && i > cur);
      p.classList.toggle("active", i === cur);
    }));
    ui.pos.textContent = cur >= 0 ? `Bước ${cur + 1}/${steps.length}` : `${steps.length} bước`;
    ui.play.textContent = playing ? "❚❚ Dừng" : (cur >= steps.length - 1 ? "↻ Chạy lại" : "▶ Chạy");
  }
  function travel(i, done) {
    const st = steps[i];
    packet.setAttribute("class", `packet ch-${st.ch}`);
    if (reduceMotion) { const p = st.path.getPointAtLength(st.path.getTotalLength()); packet.setAttribute("cx", p.x); packet.setAttribute("cy", p.y); done(); return; }
    const len = st.path.getTotalLength(), dur = Math.min(1100, 350 + len * 1.6), t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), p = st.path.getPointAtLength(len * k);
      packet.setAttribute("cx", p.x); packet.setAttribute("cy", p.y);
      if (k < 1) raf = requestAnimationFrame(tick); else done();
    };
    raf = requestAnimationFrame(tick);
  }
  function go(i, chain) {
    cur = i; paint();
    travel(i, () => {
      if (chain && playing && cur < steps.length - 1) timer = setTimeout(() => go(cur + 1, true), 350);
      else { playing = false; paint(); }
    });
  }
  function stop() { playing = false; clearTimeout(timer); cancelAnimationFrame(raf); paint(); }
  ui.play.addEventListener("click", () => {
    if (playing) return stop();
    playing = true;
    go(cur >= steps.length - 1 || cur < 0 ? 0 : cur + 1, true);
  });
  ui.next.addEventListener("click", () => { stop(); go(cur >= steps.length - 1 ? 0 : cur + 1, false); });
  ui.reset.addEventListener("click", () => { stop(); cur = -1; packet.setAttribute("cx", -20); paint(); });
  paint();
  return stop;
}

// ---- Flow tabs ----
function setupFlowTab(tab) {
  const view = document.getElementById("view-" + tab);
  const nav = view.querySelector(".flow-list");
  const out = view.querySelector(".flow-view");
  const flows = FLOWS.filter(f => f.tab === tab);
  let group = null, stopPlayer = null;
  const btns = {};
  flows.forEach((f, i) => {
    if (f.group !== group) {
      group = f.group;
      const h = document.createElement("div");
      h.className = "flow-group";
      h.textContent = group;
      nav.appendChild(h);
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "flow-btn";
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span>${f.title}</span>`;
    b.addEventListener("click", () => show(f.id));
    nav.appendChild(b);
    btns[f.id] = b;
  });
  function show(id) {
    const f = FLOWS.find(x => x.id === id);

    if (stopPlayer) stopPlayer();
    out.innerHTML = `<div class="diagram-head"><h2>${f.title}</h2><p>${f.summary}</p></div><div class="player"><button type="button" class="primary" data-act="play">▶ Chạy</button><button type="button" data-act="next">Bước tiếp ›</button><button type="button" data-act="reset">Về đầu</button><button type="button" class="anim-btn" data-act="flow" aria-pressed="true">Tắt dòng chảy</button><span class="pos"></span></div><div class="scroll"><svg class="animate" role="img" aria-label="Sơ đồ tuần tự: ${f.title}"></svg></div>${f.notes.length ? `<ul class="notes">${f.notes.map(n => `<li>${n}</li>`).join("")}</ul>` : ""}<div class="sources">Nguồn: ${f.sources.map(s => `<code>${s}</code>`).join("")}</div>`;
    const svg = out.querySelector("svg");
    const steps = drawFlow(svg, f);
    const q = a => out.querySelector(`[data-act="${a}"]`);
    stopPlayer = makePlayer(svg, steps, { play: q("play"), next: q("next"), reset: q("reset"), pos: out.querySelector(".pos") });
    q("flow").addEventListener("click", e => {
      const on = !svg.classList.contains("animate");

      e.currentTarget.setAttribute("aria-pressed", String(on));
      e.currentTarget.textContent = on ? "Tắt dòng chảy" : "Hiện dòng chảy";
    });

}

// ---- Tabs, synced with the URL hash ----
