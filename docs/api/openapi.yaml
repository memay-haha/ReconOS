openapi: 3.1.0
info:
  title: ReconOS API
  version: 1.0.0
  description: "Bản thiết kế viết tay. Quy ước: docs/api/architecture.md. Khi có mã, file này sinh từ FastAPI."
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: "Đăng nhập, tạo phiên"
      x-roles: []
      security: []
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Đăng xuất, hủy phiên hiện tại"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      tags: [auth]
      summary: "Tài khoản đang đăng nhập"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      tags: [auth]
      summary: "Đổi mật khẩu của chính mình"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users:
    get:
      tags: [user]
      summary: "Danh sách tài khoản. Admin chỉ nhận id, username, role"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [user]
      summary: "Tạo tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Chi tiết tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [user]
      summary: "Sửa tài khoản, đổi vai trò. Không đổi vai trò của chính mình"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/lock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Khóa tài khoản, hủy mọi phiên. Không khóa chính mình"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/unlock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Mở khóa tài khoản"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/sessions:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Phiên đăng nhập của tài khoản"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions:
    get:
      tags: [user]
      summary: "Phiên đang hoạt động của mọi tài khoản, không gồm phiên đã hết hạn"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions/{user_session_id}:
    parameters:
      - {name: user_session_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [user]
      summary: "Thu hồi phiên"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /workers:
    get:
      tags: [worker]
      summary: "Danh sách worker và heartbeat"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [worker]
      summary: "Đăng ký worker"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /workers/{worker_id}/tokens:
    parameters:
      - {name: worker_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Tạo token worker, trả token một lần"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /worker-tokens/{worker_token_id}/revoke:
    parameters:
      - {name: worker_token_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Thu hồi token worker"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs:
    get:
      tags: [program]
      summary: "Danh sách program"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - {name: status, in: query, schema: {type: string, enum: [active, paused]}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Tạo program"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Chi tiết program"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [program]
      summary: "Sửa program"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa cứng program"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/pause:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tạm dừng program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/resume:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tiếp tục program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/archive:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Lưu trữ program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "User được gán vào program"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Gán User vào program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users/{user_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [program]
      summary: "Bỏ gán User khỏi program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/proxies:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Danh sách proxy, URL đã che"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Thêm proxy"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /proxies/{proxy_id}:
    parameters:
      - {name: proxy_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [program]
      summary: "Sửa proxy"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa proxy"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-rules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [scope]
      summary: "Danh sách scope rule"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [scope]
      summary: "Thêm scope rule"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /scope-rules/{scope_rule_id}:
    parameters:
      - {name: scope_rule_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [scope]
      summary: "Sửa scope rule"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [scope]
      summary: "Xóa scope rule"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-check:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [scope]
      summary: "Kiểm tra danh sách mục tiêu với scope"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/schedules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [job]
      summary: "Danh sách lịch quét định kỳ"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [job]
      summary: "Tạo lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{schedule_id}:
    parameters:
      - {name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [job]
      summary: "Sửa, bật, tắt lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [job]
      summary: "Xóa lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /tool-modules:
    get:
      tags: [tool_module]
      summary: "Danh sách tool module, nhóm, schema tham số"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /tool-modules/{tool_module_id}:
    parameters:
      - {name: tool_module_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [tool_module]
      summary: "Sửa cấu hình tool module"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /engines:
    get:
      tags: [engine]
      summary: "Danh sách engine, API key đã che"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [engine]
      summary: "Sửa kết nối engine"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}/test:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [engine]
      summary: "Kiểm tra kết nối engine, response version theo api/architecture.md"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}/variables:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [engine]
      summary: "Danh sách biến engine, giá trị đã che"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}/variables/{key}:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: key, in: path, required: true, schema: {type: string}}
    put:
      tags: [engine]
      summary: "Đặt giá trị biến engine"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [engine]
      summary: "Xóa biến engine"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /jobs:
    get:
      tags: [job]
      summary: "Danh sách job"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - {name: status, in: query, schema: {type: string, enum: [pending_approval, queued, dispatched, running, completed, failed, cancelled]}}
        - $ref: '#/components/parameters/program_id'
        - {name: target, in: query, schema: {type: string}, description: "Job có mục tiêu này"}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [job]
      summary: "Tạo job, kiểm tra scope và tham số"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [job]
      summary: "Chi tiết job"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/approve:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [job]
      summary: "Duyệt job nhóm khai thác"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/reject:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [job]
      summary: "Từ chối job nhóm khai thác"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/cancel:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [job]
      summary: "Hủy job"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/retry:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [job]
      summary: "Thử lại job, tạo job mới"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /dispatcher/status:
    get:
      tags: [dispatcher]
      summary: "Trạng thái dispatcher và hàng đợi, trường theo api/architecture.md"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/raw-outputs:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [raw_output]
      summary: "Output thô của job"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /raw-outputs/{raw_output_id}:
    parameters:
      - {name: raw_output_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [raw_output]
      summary: "Metadata output thô"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /raw-outputs/{raw_output_id}/content:
    parameters:
      - {name: raw_output_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [raw_output]
      summary: "Tải nội dung output thô"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {description: Stream file, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Problem'}
  /raw-outputs/{raw_output_id}/reparse:
    parameters:
      - {name: raw_output_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [raw_output]
      summary: "Parse lại output thô"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /domains:
    get:
      tags: [asset]
      summary: "Danh sách domain"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/program_id'
