      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /system-settings/{key}:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string}}
    get:
      tags: [system]
      summary: "Đọc một ngưỡng vận hành. Admin, User chỉ đọc key Đọc công khai trong configuration.md"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [system]
      summary: "Sửa một ngưỡng vận hành"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /logs:
    get:
      tags: [system]
      summary: "Log ứng dụng, lọc theo cấp độ, tiến trình, thời gian, program, sự kiện, engine. User chỉ nhận log của job thuộc program được gán"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - {name: level, in: query, schema: {type: string, enum: [info, warning, error, critical]}}
        - {name: service, in: query, schema: {type: string}}
        - {name: logged_at_from, in: query, schema: {type: string, format: date-time}}
        - {name: logged_at_to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/program_id'
        - {name: event, in: query, schema: {type: string}}
        - {name: engine, in: query, schema: {type: string, enum: [osmedeus, vigolium]}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [system]
      summary: "Xóa log ứng dụng của các ngày trước ngày chọn"
      x-roles: [superadmin]
      parameters:
        - {name: before, in: query, required: true, schema: {type: string, format: date}, description: "Không được sau ngày hiện tại theo UTC"}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/logs:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [job]
      summary: "Log của job"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /ws:
    get:
      tags: [realtime]
      summary: "Kết nối WebSocket nhận sự kiện"
      x-roles: [superadmin, admin, user]
      responses:
        '101': {description: Chuyển sang WebSocket}
        default: {$ref: '#/components/responses/Problem'}
  /worker/heartbeat:
    post:
      tags: [worker_contract]
      summary: "Worker báo còn hoạt động, kèm tool module, công cụ đã cài, tải CPU"
      x-roles: [worker]
      security: [{worker_token: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WorkerHeartbeat'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /worker/jobs/{job_id}/claim:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker_contract]
      summary: "Nhận job, trả đặc tả job"
      x-roles: [worker]
      security: [{worker_token: []}]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /worker/jobs/{job_id}/heartbeat:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker_contract]
      summary: "Heartbeat job, trả `continue` hoặc `cancel`"
      x-roles: [worker]
      security: [{worker_token: []}]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /worker/jobs/{job_id}/raw-outputs/{filename}:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: filename, in: path, required: true, schema: {type: string}}
    put:
      tags: [worker_contract]
      summary: "Upload một file output thô"
      x-roles: [worker]
      security: [{worker_token: []}]
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '201': {description: Đã lưu mới}
        '200': {description: "Đã có cùng tên, không ghi đè"}
        default: {$ref: '#/components/responses/Problem'}
  /worker/jobs/{job_id}/finish:
    parameters:
      - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker_contract]
      summary: "Kết thúc job, kèm status, status_reason, tool_version"
      x-roles: [worker]
      security: [{worker_token: []}]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /worker/logs:
    post:
      tags: [worker_contract]
      summary: "Gửi log của worker theo lô"
      x-roles: [worker]
      security: [{worker_token: []}]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-session}
    worker_token: {type: http, scheme: bearer}
  parameters:
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    sort: {name: sort, in: query, schema: {type: string}}
    program_id: {name: program_id, in: query, schema: {type: string, format: uuid}}
    q: {name: q, in: query, schema: {type: string}, description: "Chuỗi con không phân biệt hoa thường, cột tìm theo api/architecture.md"}
    ids: {name: ids, in: query, schema: {type: array, maxItems: 500, items: {type: string, format: uuid}}, description: "Chỉ xuất các dòng này"}
    format: {name: format, in: query, schema: {type: string, enum: [csv, jsonl, md], default: csv}}
  schemas:
    PageMeta:
      type: object
      required: [items, next_cursor, total, total_is_estimate]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: [string, 'null']}
        total: {type: integer}
        total_is_estimate: {type: boolean}
    SearchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [type, id, label, program_id]
            properties:
              type: {type: string, enum: [program, domain, url, finding, tool_module]}
              id: {type: string, format: uuid}
              label: {type: string, description: "Dữ liệu của mục tiêu, hiển thị dạng văn bản"}
              program_id: {type: [string, 'null'], format: uuid, description: "NULL với tool_module"}
    RolePermissions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [action, superadmin, admin, user, note]
            properties:
              action: {type: string}
              superadmin: {$ref: '#/components/schemas/PermissionGrant'}
              admin: {$ref: '#/components/schemas/PermissionGrant'}
              user: {$ref: '#/components/schemas/PermissionGrant'}
              note: {type: [string, 'null']}
    PermissionGrant: {type: string, enum: [allow, deny, limited]}
    Worker:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        tool_modules: {type: array, items: {type: string}}
        tool_versions:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              version: {type: [string, 'null']}
        cpu_percent: {type: [number, 'null']}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        is_online: {type: boolean}
        running_job_count: {type: integer}
        running_tool_module_ids: {type: array, items: {type: string, format: uuid}}
    ParamSchema:
      type: object
      description: "JSON Schema dạng object. Tham số số luồng và tốc độ dùng khóa threads, rate"
      properties:
        type: {type: string, enum: [object]}
        properties:
          type: object
          additionalProperties:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              description: {type: string}
              default: {}
              minimum: {type: number}
              maximum: {type: number}
              enum: {type: array}
    ToolModule:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        title: {type: string}
        description: {type: string}
        group: {type: string, enum: [recon, scan, exploit]}
        is_enabled: {type: boolean}
        default_params: {type: object}
        max_concurrency: {type: integer}
        rate_limit_per_minute: {type: [integer, 'null']}
        timeout_minutes: {type: integer}
        updated_at: {type: string, format: date-time}
        runs_on: {type: [string, 'null'], description: "Tên engine, NULL khi chạy công cụ trực tiếp"}
        tools: {type: array, items: {type: string}}
        output_types: {type: array, items: {type: string, enum: [domain, ip, url, service, screenshot, finding]}}
        param_schema: {$ref: '#/components/schemas/ParamSchema'}
        last_job_at: {type: [string, 'null'], format: date-time}
        jobs_24h: {type: integer}
        finding_count: {type: integer}
        engine_status: {type: [string, 'null'], enum: [ok, degraded, down, null]}
        disabled_reason: {type: [string, 'null'], enum: [off, engine_disabled, engine_down, not_installed, null]}
        estimated_seconds: {type: [integer, 'null']}
    ToolModuleList:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ToolModule'}}
            enabled_count: {type: integer}
            disabled_count: {type: integer}
            disabled_names: {type: array, items: {type: string}}
            group_counts:
              type: object
              properties:
                recon: {type: integer}
                scan: {type: integer}
                exploit: {type: integer}
            engines_bound: {type: integer}
            installed_count: {type: integer}
            ready_count: {type: integer}
    Tool:
      type: object
      properties:
        name: {type: string}
        tool_modules: {type: array, items: {type: string}}
        status: {type: string, enum: [installed, missing]}
        installed:
          type: array
          items:
            type: object
            properties:
              worker_name: {type: string}
              version: {type: [string, 'null']}
    EngineWorkflow:
      type: object
      properties:
        name: {type: string}
        kind: {type: string, description: "Loại workflow Osmedeus: flow hoặc module"}
        step_count: {type: [integer, 'null']}
        description: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
    EngineWorkflowDetail:
      allOf:
        - {$ref: '#/components/schemas/EngineWorkflow'}
        - type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  description: {type: [string, 'null']}
    EngineModule:
      type: object
      properties:
        name: {type: string}
        kind: {type: string, enum: [active, passive], description: "active gửi lưu lượng tới mục tiêu, passive chỉ đọc lưu lượng"}
        is_enabled: {type: boolean}
        description: {type: [string, 'null']}
    EngineCheckResult:
      type: object
      required: [ok, issues]
      properties:
        ok: {type: boolean}
        issues:
          type: array
          items:
            type: object
            properties:
              level: {type: string, enum: [critical, advisory]}
              message: {type: string}
    Job:
      type: object
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        tool_module_id: {type: string, format: uuid}
        tool_module_name: {type: string}
        status: {type: string, enum: [pending_approval, queued, dispatched, running, completed, failed, cancelled]}
        priority: {type: string, enum: [low, normal, high]}
        target: {type: array, items: {type: string}}
        params: {type: object}
        proxy_id: {type: [string, 'null'], format: uuid}
        schedule_id: {type: [string, 'null'], format: uuid}
        retry_of_job_id: {type: [string, 'null'], format: uuid}
        worker_id: {type: [string, 'null'], format: uuid}
        worker_name: {type: [string, 'null']}
        created_by: {type: [string, 'null'], format: uuid}
        created_by_username: {type: [string, 'null']}
        approved_by: {type: [string, 'null'], format: uuid}
        status_reason: {type: [string, 'null']}
        tool_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        dispatched_at: {type: [string, 'null'], format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        status_changed_at: {type: string, format: date-time}
    JobBulkCreateResult:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Job'}}
    Technology:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        category: {type: [string, 'null']}
    Screenshot:
      type: object
      description: "Mọi trường chữ lấy từ mục tiêu, hiển thị dạng văn bản"
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        url_id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        raw_output_id: {type: string, format: uuid}
        final_url: {type: [string, 'null']}
        status_code: {type: [integer, 'null']}
        title: {type: [string, 'null']}
        perception_hash: {type: [string, 'null']}
        http_headers: {type: [object, 'null']}
        is_failed: {type: boolean}
        error_message: {type: [string, 'null']}
        captured_at: {type: string, format: date-time}
        similar_group: {type: [integer, 'null']}
        similar_count: {type: integer}
        technologies:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              category: {type: [string, 'null']}
        retry_job_status: {type: [string, 'null'], enum: [pending_approval, queued, dispatched, running, completed, failed, cancelled, null]}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
    ScreenshotDetail:
      allOf:
        - {$ref: '#/components/schemas/Screenshot'}
        - type: object
          properties:
            worker_name: {type: [string, 'null']}
            device_scale: {type: [number, 'null']}
            remote_ip: {type: [string, 'null']}
            duration_ms: {type: [integer, 'null']}
            tls:
              type: [object, 'null']
              properties:
                protocol: {type: [string, 'null']}
                cipher: {type: [string, 'null']}
                issuer: {type: [string, 'null']}
                subject: {type: [string, 'null']}
                san: {type: array, items: {type: string}}
                not_before: {type: [string, 'null'], format: date-time}
                not_after: {type: [string, 'null'], format: date-time}
            console_log:
              type: array
              items:
                type: object
                properties:
                  level: {type: string}
                  message: {type: string}
                  at: {type: [string, 'null'], format: date-time}
            cookies:
              type: array
              description: "Không có giá trị cookie (G7)"
              items:
                type: object
                properties:
                  name: {type: string}
                  domain: {type: [string, 'null']}
                  path: {type: [string, 'null']}
                  expires: {type: [string, 'null'], format: date-time}
                  secure: {type: boolean}
                  http_only: {type: boolean}
                  same_site: {type: [string, 'null']}
            html_size: {type: [integer, 'null']}
            html_sha256: {type: [string, 'null']}
            security_headers:
              type: object
              description: "Khóa là tên header viết thường, giá trị true khi có mặt"
              properties:
                strict-transport-security: {type: boolean}
                content-security-policy: {type: boolean}
                x-frame-options: {type: boolean}
                x-content-type-options: {type: boolean}
                permissions-policy: {type: boolean}
            security_headers_passed: {type: integer}
            security_headers_total: {type: integer}
    ScreenshotSummary:
      type: object
      required: [by_status_code]
      properties:
        by_status_code:
          type: object
          properties:
            2xx: {type: integer}
            3xx: {type: integer}
            4xx: {type: integer}
            5xx: {type: integer}
    ScreenshotNetwork:
      type: object
      required: [network_log]
      properties:
        network_log:
          type: array
          items:
            type: object
            properties:
              method: {type: string}
              url: {type: string}
              status_code: {type: [integer, 'null']}
              content_type: {type: [string, 'null']}
              size_bytes: {type: [integer, 'null']}
              duration_ms: {type: [integer, 'null']}
              remote_ip: {type: [string, 'null']}
    Alert:
      type: object
      properties:
        id: {type: string, format: uuid}
        alert_type: {type: string, enum: [finding_new, job_pending_approval, job_failed, asset_new, cert_expiring]}
        message: {type: string}
        program_id: {type: [string, 'null'], format: uuid}
        finding_id: {type: [string, 'null'], format: uuid}
        job_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        is_read: {type: boolean}
    SavedFilter:
      type: object
      properties:
        id: {type: string, format: uuid}
        screen: {type: string}
        name: {type: string}
        params: {type: object}
        created_at: {type: string, format: date-time}
    DiagnosticRunCreated:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [running, passed, failed]}
    DiagnosticRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [running, passed, failed]}
        exit_code: {type: [integer, 'null']}
        output: {type: [string, 'null'], description: "Mỗi dòng bắt đầu bằng [OK], [WARN], [FAIL] hoặc [*]"}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    Ids:
      type: object
      required: [ids]
      properties:
        ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
    ProgramCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        platform: {type: [string, 'null'], maxLength: 255}
        platform_url: {type: [string, 'null'], description: "Chỉ http, https. Sai: mã url_invalid"}
        platform_handle: {type: [string, 'null'], maxLength: 255}
        bounty_type: {type: string, enum: [bounty, vdp], default: bounty}
        description: {type: [string, 'null'], maxLength: 10000}
    Program:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        platform: {type: [string, 'null']}
        platform_url: {type: [string, 'null']}
        platform_handle: {type: [string, 'null']}
        bounty_type: {type: string, enum: [bounty, vdp]}
        description: {type: [string, 'null']}
        status: {type: string, enum: [active, paused, archived]}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: [string, 'null'], format: date-time}
    ProxyCreate:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        url: {type: string, writeOnly: true, description: "Scheme http, https, socks4, socks4a, socks5, socks5h, có host, không path, query, fragment. Sai: mã proxy_url_invalid, lỗi không lặp lại giá trị"}
        is_enabled: {type: boolean, default: true}
    Proxy:
      type: object
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        name: {type: string}
        is_enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    JobCreate:
      type: object
      required: [program_id, tool_module_id, target]
      properties:
        program_id: {type: string, format: uuid}
        tool_module_id: {type: string, format: uuid}
        target: {type: array, minItems: 1, items: {type: string}}
        params: {type: object, description: "Theo param_schema của tool module"}
        priority: {type: string, enum: [low, normal, high], default: normal}
        proxy_id: {type: [string, 'null'], format: uuid}
    JobBulkCreate:
      type: object
      required: [program_id, target, items]
      properties:
        program_id: {type: string, format: uuid}
        target: {type: array, minItems: 1, items: {type: string}}
        priority: {type: string, enum: [low, normal, high], default: normal}
        proxy_id: {type: [string, 'null'], format: uuid}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [tool_module_id]
            properties:
              tool_module_id: {type: string, format: uuid}
              params: {type: object}
    ScopeRule:
      type: object
      required: [id, program_id, scope_type, rule_type, value, reason, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        program_id: {type: string, format: uuid}
        scope_type: {type: string, enum: [in_scope, out_of_scope]}
        rule_type: {type: string, enum: [domain, wildcard, cidr, url]}
        value: {type: string, description: "Dạng chuẩn hóa theo business-flow.md"}
        reason: {type: [string, 'null']}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    ScopeRuleCreate:
      type: object
      required: [scope_type, rule_type, value]
      properties:
        scope_type: {type: string, enum: [in_scope, out_of_scope]}
        rule_type: {type: string, enum: [domain, wildcard, cidr, url]}
        value: {type: string, minLength: 1, maxLength: 2048}
        reason: {type: [string, 'null'], maxLength: 1000, description: "Bắt buộc khi scope_type là out_of_scope"}
    ScopeRuleUpdate:
      type: object
      properties:
        scope_type: {type: string, enum: [in_scope, out_of_scope]}
        rule_type: {type: string, enum: [domain, wildcard, cidr, url]}
        value: {type: string, minLength: 1, maxLength: 2048}
        reason: {type: [string, 'null'], maxLength: 1000}
    ScopeCheckResult:
      type: object
      required: [target, normalized_target, in_scope, verdict, rule_value]
      properties:
        target: {type: string}
        normalized_target: {type: [string, 'null']}
        in_scope: {type: boolean}
        verdict: {type: string, enum: [in_scope, invalid_target, no_in_scope_match, out_of_scope_match]}
        rule_value: {type: [string, 'null']}
    WorkerHeartbeat:
      type: object
      required: [tool_modules, tools]
      properties:
        tool_modules: {type: array, items: {type: string}}
        tools:
          type: array
          items:
            type: object
            required: [name, version]
            properties:
              name: {type: string}
              version: {type: [string, 'null']}
        cpu_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
  responses:
    Page:
      description: Một trang dữ liệu
      content:
        application/json:
          schema:
            type: object
            required: [items, next_cursor, total, total_is_estimate]
            properties:
              items: {type: array, items: {type: object}}
              next_cursor: {type: [string, 'null']}
              total: {type: integer}
              total_is_estimate: {type: boolean}
    Object:
      description: Một object, trường theo docs/data/schema.md
      content:
        application/json:
          schema: {type: object}
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              detail: {type: string}
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: {type: string}
                    code: {type: string}
