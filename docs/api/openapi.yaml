openapi: 3.1.0
info:
  title: ReconOS API
  version: 1.0.0
  description: "Bản thiết kế viết tay. Quy ước, trường tính, tham số q: docs/api/architecture.md. Khi có mã, file này sinh từ FastAPI. Bản 2026-11-12: thêm endpoint theo sổ quyết định 2026-11-11."
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: "Đăng nhập, tạo phiên"
      x-roles: []
      security: []
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Đăng xuất, hủy phiên hiện tại"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      tags: [auth]
      summary: "Tài khoản đang đăng nhập"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      tags: [auth]
      summary: "Đổi mật khẩu của chính mình"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users:
    get:
      tags: [user]
      summary: "Danh sách tài khoản. Admin chỉ nhận id, username, role. Superadmin nhận thêm last_session_ip, last_seen_at và khóa tổng hợp role_counts, locked_count"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/q'
        - {name: role, in: query, schema: {type: string, enum: [superadmin, admin, user]}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [user]
      summary: "Tạo tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Chi tiết tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [user]
      summary: "Sửa tài khoản, đổi vai trò. Không đổi vai trò của chính mình"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [user]
      summary: "Xóa mềm tài khoản, thu hồi mọi phiên. Không xóa chính mình"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/lock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Khóa tài khoản, hủy mọi phiên. Không khóa chính mình"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/unlock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Mở khóa tài khoản"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/revoke-sessions:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Thu hồi mọi phiên của tài khoản. Với chính mình: giữ phiên đang gọi"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/bulk-revoke-sessions:
    post:
      tags: [user]
      summary: "Thu hồi phiên hàng loạt, body ids"
      x-roles: [superadmin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/export:
    get:
      tags: [user]
      summary: "Xuất danh sách tài khoản, không có cột thông tin xác thực"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/q'
        - {name: role, in: query, schema: {type: string, enum: [superadmin, admin, user]}}
      responses:
        '200': {description: Stream file, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Problem'}
  /roles/permissions:
    get:
      tags: [user]
      summary: "Ma trận quyền sinh từ khai báo quyền của backend"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/sessions:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Phiên đăng nhập của tài khoản"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions:
    get:
      tags: [user]
      summary: "Phiên đang hoạt động của mọi tài khoản, không gồm phiên đã hết hạn. Mỗi dòng thêm username, display_name. Khóa tổng hợp account_count"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions/{user_session_id}:
    parameters:
      - {name: user_session_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [user]
      summary: "Thu hồi phiên"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /workers:
    get:
      tags: [worker]
      summary: "Danh sách worker và heartbeat. Thêm is_online, running_job_count, running_tool_module_ids, cpu_percent, tool_versions"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [worker]
      summary: "Đăng ký worker"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /workers/{worker_id}/tokens:
    parameters:
      - {name: worker_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Tạo token worker, trả token một lần"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /worker-tokens/{worker_token_id}/revoke:
    parameters:
      - {name: worker_token_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Thu hồi token worker"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs:
    get:
      tags: [program]
      summary: "Danh sách program. sort nhận name, -domain_count, -finding_critical_count, -last_job_finished_at"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - {name: status, in: query, schema: {type: string, enum: [active, paused]}}
        - $ref: '#/components/parameters/q'
        - {name: has_in_scope_rule, in: query, schema: {type: boolean}}
        - {name: has_domain, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Tạo program"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-pause:
    post:
      tags: [program]
      summary: "Tạm dừng nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-resume:
    post:
      tags: [program]
      summary: "Tiếp tục nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-archive:
    post:
      tags: [program]
      summary: "Lưu trữ nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-delete:
    post:
      tags: [program]
      summary: "Xóa cứng nhiều program như DELETE /programs/{program_id}, body ids"
      x-roles: [superadmin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Chi tiết program"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [program]
      summary: "Sửa program"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa cứng program"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/pause:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tạm dừng program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/resume:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tiếp tục program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/archive:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Lưu trữ program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "User được gán vào program"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Gán User vào program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users/{user_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [program]
      summary: "Bỏ gán User khỏi program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/proxies:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Danh sách proxy, URL đã che"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Thêm proxy"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /proxies/{proxy_id}:
    parameters:
      - {name: proxy_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [program]
      summary: "Sửa proxy"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa proxy"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-rules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [scope]
      summary: "Danh sách scope rule. Mỗi dòng thêm matched_domain_count"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [scope]
      summary: "Thêm scope rule"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-rules/bulk-create:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [scope]
      summary: "Thêm nhiều scope rule một lần, body items"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /scope-rules/{scope_rule_id}:
    parameters:
      - {name: scope_rule_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [scope]
      summary: "Sửa scope rule"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [scope]
      summary: "Xóa scope rule"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-check:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [scope]
      summary: "Kiểm tra danh sách mục tiêu với scope"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/schedules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [job]
      summary: "Danh sách lịch quét định kỳ"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [job]
      summary: "Tạo lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{schedule_id}:
    parameters:
      - {name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [job]
      summary: "Sửa, bật, tắt lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [job]
      summary: "Xóa lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /schedules/{schedule_id}/run:
    parameters:
      - {name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [job]
      summary: "Tạo ngay một job từ lịch, kiểm scope, không đổi next_run_at"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /tool-modules:
    get:
      tags: [tool_module]
      summary: "Danh sách tool module, nhóm, schema tham số. Trường tính và khóa tổng hợp theo api/architecture.md"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/q'
        - {name: group, in: query, schema: {type: string, enum: [recon, scan, exploit]}}
        - {name: runs_on, in: query, schema: {type: string}, description: "Tên engine"}
        - {name: is_enabled, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /tool-modules/stats:
    get:
      tags: [tool_module]
      summary: "Số job trong window, khung liền trước, job stalled"
      x-roles: [superadmin, admin, user]
      parameters:
        - {name: window, in: query, schema: {type: string, enum: [24h, 7d, 30d], default: 24h}}
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /tools:
    get:
      tags: [tool_module]
      summary: "Công cụ của tool module và phiên bản worker báo"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /tool-modules/{tool_module_id}:
    parameters:
      - {name: tool_module_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [tool_module]
      summary: "Sửa cấu hình tool module"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /engines:
    get:
      tags: [engine]
      summary: "Danh sách engine, API key đã che. Thêm version, last_tested_at, last_test_ok, api_key_updated_at, has_llm_api_key, uptime_seconds, slots_used, slots_total, settings"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [engine]
      summary: "Sửa kết nối engine, settings, llm_api_key chỉ ghi"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /engines/{engine_id}/test:
    parameters:
      - {name: engine_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [engine]
