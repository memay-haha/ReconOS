components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-session}
    worker_token: {type: http, scheme: bearer}
  parameters:
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    sort: {name: sort, in: query, schema: {type: string}}
    program_id: {name: program_id, in: query, schema: {type: string, format: uuid}}
    q: {name: q, in: query, schema: {type: string}, description: "Chuỗi con không phân biệt hoa thường, cột tìm theo api/architecture.md"}
    ids: {name: ids, in: query, schema: {type: array, maxItems: 500, items: {type: string, format: uuid}}, description: "Chỉ xuất các dòng này"}
    format: {name: format, in: query, schema: {type: string, enum: [csv, jsonl, md], default: csv}}
  schemas:
    Ids:
      type: object
      required: [ids]
      properties:
        ids: {type: array, minItems: 1, maxItems: 500, items: {type: string, format: uuid}}
    JobCreate:
      type: object
      required: [program_id, tool_module_id, target]
      properties:
        program_id: {type: string, format: uuid}
        tool_module_id: {type: string, format: uuid}
        target: {type: array, minItems: 1, items: {type: string}}
        params: {type: object, description: "Theo param_schema của tool module"}
        priority: {type: string, enum: [low, normal, high], default: normal}
        proxy_id: {type: [string, 'null'], format: uuid}
    JobBulkCreate:
      type: object
      required: [program_id, target, items]
      properties:
        program_id: {type: string, format: uuid}
        target: {type: array, minItems: 1, items: {type: string}}
        priority: {type: string, enum: [low, normal, high], default: normal}
        proxy_id: {type: [string, 'null'], format: uuid}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [tool_module_id]
            properties:
              tool_module_id: {type: string, format: uuid}
              params: {type: object}
    WorkerHeartbeat:
