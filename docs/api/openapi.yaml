openapi: 3.1.0
info:
  title: ReconOS API
  version: 1.0.0
  description: "Bản thiết kế viết tay. Quy ước, trường tính, tham số q: docs/api/architecture.md. Khi có mã, file này sinh từ FastAPI. Bản 2026-11-12: thêm endpoint theo sổ quyết định 2026-11-11."
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: "Đăng nhập, tạo phiên"
      x-roles: []
      security: []
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Đăng xuất, hủy phiên hiện tại"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      tags: [auth]
      summary: "Tài khoản đang đăng nhập"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      tags: [auth]
      summary: "Đổi mật khẩu của chính mình"
      x-roles: [superadmin, admin, user]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users:
    get:
      tags: [user]
      summary: "Danh sách tài khoản. Admin chỉ nhận id, username, role. Superadmin nhận thêm last_session_ip, last_seen_at và khóa tổng hợp role_counts, locked_count"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/q'
        - {name: role, in: query, schema: {type: string, enum: [superadmin, admin, user]}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [user]
      summary: "Tạo tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Chi tiết tài khoản"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [user]
      summary: "Sửa tài khoản, đổi vai trò. Không đổi vai trò của chính mình"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [user]
      summary: "Xóa mềm tài khoản, thu hồi mọi phiên. Không xóa chính mình"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/lock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Khóa tài khoản, hủy mọi phiên. Không khóa chính mình"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/unlock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Mở khóa tài khoản"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/revoke-sessions:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [user]
      summary: "Thu hồi mọi phiên của tài khoản. Với chính mình: giữ phiên đang gọi"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/bulk-revoke-sessions:
    post:
      tags: [user]
      summary: "Thu hồi phiên hàng loạt, body ids"
      x-roles: [superadmin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /users/export:
    get:
      tags: [user]
      summary: "Xuất danh sách tài khoản, không có cột thông tin xác thực"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/q'
        - {name: role, in: query, schema: {type: string, enum: [superadmin, admin, user]}}
      responses:
        '200': {description: Stream file, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Problem'}
  /roles/permissions:
    get:
      tags: [user]
      summary: "Ma trận quyền sinh từ khai báo quyền của backend"
      x-roles: [superadmin]
      responses:
        '200': {description: Thành công, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissions'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /users/{user_id}/sessions:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [user]
      summary: "Phiên đăng nhập của tài khoản"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions:
    get:
      tags: [user]
      summary: "Phiên đang hoạt động của mọi tài khoản, không gồm phiên đã hết hạn. Mỗi dòng thêm username, display_name. Khóa tổng hợp account_count"
      x-roles: [superadmin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - {name: sort, in: query, schema: {type: string, enum: [created_at, '-created_at', last_seen_at, '-last_seen_at'], default: '-created_at'}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
  /user-sessions/{user_session_id}:
    parameters:
      - {name: user_session_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [user]
      summary: "Thu hồi phiên"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /workers:
    get:
      tags: [worker]
      summary: "Danh sách worker và heartbeat. Thêm is_online, running_job_count, running_tool_module_ids, cpu_percent, tool_versions"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {description: Một trang dữ liệu, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/PageMeta'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Worker'}}}}]}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [worker]
      summary: "Đăng ký worker"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /workers/{worker_id}/tokens:
    parameters:
      - {name: worker_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Tạo token worker, trả token một lần"
      x-roles: [superadmin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /worker-tokens/{worker_token_id}/revoke:
    parameters:
      - {name: worker_token_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [worker]
      summary: "Thu hồi token worker"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs:
    get:
      tags: [program]
      summary: "Danh sách program, không gồm program archived. User chỉ nhận program được gán"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - {name: sort, in: query, schema: {type: string, enum: [name, -domain_count, -finding_critical_count, -last_job_finished_at], default: name}}
        - {name: status, in: query, schema: {type: string, enum: [active, paused]}}
        - $ref: '#/components/parameters/q'
        - {name: has_in_scope_rule, in: query, schema: {type: boolean}}
        - {name: has_domain, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Tạo program, trạng thái active. Trùng name: 409 conflict"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProgramCreate'}}}
      responses:
        '200':
          description: Program vừa tạo, không có trường tính
          content: {application/json: {schema: {$ref: '#/components/schemas/Program'}}}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-pause:
    post:
      tags: [program]
      summary: "Tạm dừng nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-resume:
    post:
      tags: [program]
      summary: "Tiếp tục nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-archive:
    post:
      tags: [program]
      summary: "Lưu trữ nhiều program, body ids"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/bulk-delete:
    post:
      tags: [program]
      summary: "Xóa cứng nhiều program như DELETE /programs/{program_id}, body ids"
      x-roles: [superadmin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Ids'}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Chi tiết program kèm trường tính. Program chưa gán cho User: 404"
      x-roles: [superadmin, admin, user]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [program]
      summary: "Sửa program, chỉ gửi trường cần đổi. Program archived: 409 conflict"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProgramCreate'}}}
      responses:
        '200':
          description: Program sau khi sửa
          content: {application/json: {schema: {$ref: '#/components/schemas/Program'}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa cứng program"
      x-roles: [superadmin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/pause:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tạm dừng program: active sang paused. Trạng thái khác: 409 conflict"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/resume:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Tiếp tục program: paused sang active. Trạng thái khác: 409 conflict"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/archive:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [program]
      summary: "Lưu trữ program: active hoặc paused sang archived. Không bỏ lưu trữ được"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "User được gán vào program, gán gần nhất trước. Mỗi dòng program_id, user_id, assigned_by, assigned_at"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - {name: sort, in: query, schema: {type: string, enum: [-assigned_at], default: -assigned_at}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Gán User vào program. Chỉ tài khoản vai trò user. Đã gán: 409 conflict"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [user_id], properties: {user_id: {type: string, format: uuid}}}}}
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/users/{user_id}:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [program]
      summary: "Bỏ gán User khỏi program"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/proxies:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [program]
      summary: "Danh sách proxy, tạo gần nhất trước. Không trả URL, kể cả dạng che"
      x-roles: [superadmin, admin]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - {name: sort, in: query, schema: {type: string, enum: [-created_at], default: -created_at}}
      responses:
        '200': {description: Một trang dữ liệu, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/PageMeta'}, {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Proxy'}}}}]}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [program]
      summary: "Thêm proxy. URL lưu mã hóa. Trùng name trong program: 409 conflict. Program archived: 409 conflict"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProxyCreate'}}}
      responses:
        '200':
          description: Proxy vừa tạo, không có URL
          content: {application/json: {schema: {$ref: '#/components/schemas/Proxy'}}}
        default: {$ref: '#/components/responses/Problem'}
  /proxies/{proxy_id}:
    parameters:
      - {name: proxy_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [program]
      summary: "Sửa proxy, chỉ gửi trường cần đổi. Gửi url để thay URL đã lưu"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProxyCreate'}}}
      responses:
        '200':
          description: Proxy sau khi sửa, không có URL
          content: {application/json: {schema: {$ref: '#/components/schemas/Proxy'}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [program]
      summary: "Xóa proxy"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-rules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [scope]
      summary: "Danh sách scope rule. matched_domain_count có từ khi có bảng domain"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - {name: sort, in: query, schema: {type: string, enum: [created_at, -created_at], default: created_at}}
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [scope]
      summary: "Thêm scope rule. Value lưu dạng chuẩn hóa"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRuleCreate'}}}
      responses:
        '200':
          description: Scope rule vừa tạo
          content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRule'}}}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-rules/bulk-create:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [scope]
      summary: "Thêm nhiều scope rule một lần, tất cả hoặc không"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, minItems: 1, maxItems: 200, items: {$ref: '#/components/schemas/ScopeRuleCreate'}}
      responses:
        '200':
          description: Các scope rule vừa tạo theo thứ tự của body
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScopeRule'}}
        default: {$ref: '#/components/responses/Problem'}
  /scope-rules/{scope_rule_id}:
    parameters:
      - {name: scope_rule_id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [scope]
      summary: "Sửa scope rule"
      x-roles: [superadmin, admin]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRuleUpdate'}}}
      responses:
        '200':
          description: Scope rule sau khi sửa
          content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRule'}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [scope]
      summary: "Xóa scope rule"
      x-roles: [superadmin, admin]
      responses:
        '204': {description: Thành công}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/scope-check:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [scope]
      summary: "Kiểm tra danh sách mục tiêu với scope, không ghi gì"
      x-roles: [superadmin, admin, user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: {type: array, minItems: 1, maxItems: 200, items: {type: string}}
      responses:
        '200':
          description: Kết quả từng mục tiêu theo thứ tự của body
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScopeCheckResult'}}
        default: {$ref: '#/components/responses/Problem'}
  /programs/{program_id}/schedules:
    parameters:
      - {name: program_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [job]
      summary: "Danh sách lịch quét định kỳ"
      x-roles: [superadmin, admin, user]
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/sort'
      responses:
        '200': {$ref: '#/components/responses/Page'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [job]
      summary: "Tạo lịch quét định kỳ"
      x-roles: [superadmin, admin]
      responses:
        '200': {$ref: '#/components/responses/Object'}
        default: {$ref: '#/components/responses/Problem'}
  /schedules:
    get:
      tags: [job]
      summary: "Lịch quét định kỳ của mọi program xem được, thêm program_name, tool_module_name"
      x-roles: [superadmin, admin, user]
      parameters:
