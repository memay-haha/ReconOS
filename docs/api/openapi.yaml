components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-session}
    worker_token: {type: http, scheme: bearer}
  parameters:
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    sort: {name: sort, in: query, schema: {type: string}}
    program_id: {name: program_id, in: query, schema: {type: string, format: uuid}}
  responses:
    Page:
      description: Một trang dữ liệu
      content:
        application/json:
          schema:
            type: object
            required: [items, next_cursor, total, total_is_estimate]
            properties:
              items: {type: array, items: {type: object}}
              next_cursor: {type: [string, 'null']}
              total: {type: integer}
              total_is_estimate: {type: boolean}
    Object:
      description: Một object, trường theo docs/data/schema.md
      content:
        application/json:
          schema: {type: object}
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              detail: {type: string}
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: {type: string}
                    code: {type: string}
